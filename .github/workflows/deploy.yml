# Builds the website and publishes it to Cloudflare.
# Runs when: you push code, you click "Publish" in the admin (Sanity webhook), you click "Run workflow", or once a day.
name: Build & deploy to Cloudflare

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/deploy.yml']
  repository_dispatch:
    types: [sanity-publish]
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *' # 06:00 IST daily, so scheduled blog posts go live

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Build site
        run: npm run build
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_SANITY_PROJECT_ID: ${{ vars.PUBLIC_SANITY_PROJECT_ID }}
          PUBLIC_SANITY_DATASET: ${{ vars.PUBLIC_SANITY_DATASET || 'production' }}

      - name: Publish to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
